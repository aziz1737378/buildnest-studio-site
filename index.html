    <meta name="msapplication-tap-highlight" content="no" />

  <body style="margin: 0; font-family: 'Inter', 'Manrope', sans-serif;">
    <main id="root" role="main">
      <!-- Loading fallback if JS takes time -->
      <div id="loading" style="padding: 2rem; text-align: center; font-size: 1.1rem; color: #555;">
        Loading Buildnest...
      </div>

      <noscript>
        <div style="padding: 2rem; text-align: center; font-size: 1.2rem;">
          Buildnest requires JavaScript to run. Please enable it in your browser.
        </div>
      </noscript>
    </main>

    <!-- Main App Script -->
    <script type="module">
      // Remove fallback when app loads
      window.addEventListener('DOMContentLoaded', () => {
        const loading = document.getElementById('loading');
        if (loading) loading.remove();
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
